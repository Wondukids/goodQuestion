# 단가표 — 모델별 토큰 단가와 적용 시작일 (specs/001-admin-run-viewer tasks.md T090 · FR-006)
#
# 🔴 2026-08-13 — 파이썬 레포에서 옮겨 온 넷째 런타임 자산이다 (이슈 #26 E-3 · 착지 ⑤).
#    `prompts/`·`sql/`·`goldenset/` 과 같은 칸(레포 루트)에 둔다. 비용 화면이
#    **매 요청에 `readFileSync` 로 읽으므로** `next.config.ts` 의
#    `outputFileTracingIncludes` 에도 이 파일이 적혀 있어야 한다.
#    ⚠️ 값을 고칠 때는 **여기**를 고쳐라.
#
# ⚠️ 아래 문단은 파일이 처음 섰을 때(단가가 비어 있던 때) 적힌 것이다. 지금은
#    맨 아래에 실제 단가 두 줄이 들어 있다 — 2026-08-12 에 사람이 공급자 가격표를 보고
#    채웠고, 그 근거는 「모델별 단가」 절의 주석에 있다. 원칙만 그대로 살아 있다:
#    **지어낸 숫자를 넣지 않는다** (넣었다면 화면의 금액이 거짓이 된다 —
#    HANDOFF.md 「믿으면 안 되는 값」), 그리고 **표에 없는 모델의 비용은 0 이 아니라
#    「모름」**으로 나온다.
#
# 왜 파일로 두나
#   단가는 바뀌고 모델도 갈아탄다. 그래서 비용은 DB 에 저장하지 않고
#   **토큰만 원장으로 남기고 볼 때마다 이 표로 곱한다** (docs/설계/관리자페이지_검토.md).
#   코드에 박지 않는 이유는 헌법 원칙 II — 값은 설정에서 읽는다.
#
# 누가 읽나
#   `src/lib/config.ts` 의 `단가표_읽기()` (파이썬 `src/goodquestion/config.py` 의 같은 이름을 옮긴 것).
#   경로를 바꾸려면 환경변수 `GQ_PRICING_FILE` 에 다른 파일을 적는다 — 파이썬과 같은 이름이다.
#
# ⚠️ 칸 이름에 붙은 따옴표를 지우지 말 것.
#    TOML 은 따옴표 없는 이름에 영어·숫자·_·- 만 허용해서, 한글 이름은 반드시 "..." 로 감싼다.
#
# 형식을 정한 근거와 사람이 채워야 할 것의 목록은 notes/작업일지/admin-단가표.md 에 있다.


# ── 통화와 단위 ────────────────────────────────────────────────
# 이 둘은 **숫자가 아니라 「그 숫자를 어떻게 읽나」**를 적는 칸이다.
# 단가를 한 줄이라도 적으면 이 둘도 반드시 있어야 한다 (없으면 읽다가 에러가 난다).
#
# 통화: 화면에 그대로 찍힌다. 원화로 적을 거면 "KRW" 로 바꾼다.
#       ✅ 2026-08-07 사람이 확정했다 — **USD 로 간다.** 공급자 공식 단가가 달러라
#       그대로 옮겨 적으면 버전이 올라가도 그대로 가져다 붙일 수 있고 환율 오차가 안 생긴다.
#       환율 환산은 아무도 하지 않는다. 원화가 필요하면 보는 사람이 곱한다.
"통화" = "USD"

# 단위: 아래 입력_단가·출력_단가를 **무엇당 가격으로 적었는지**.
#       공급자 가격표는 보통 「백만 토큰당」으로 적혀 있어서 그것을 기본으로 뒀다.
#       천 토큰당으로 적을 거면 "천토큰당", 토큰 하나당이면 "토큰당" 으로 바꾼다.
#       고를 수 있는 값은 이 셋뿐이다: 백만토큰당 · 천토큰당 · 토큰당
"단위" = "백만토큰당"


# ── 모델별 단가 ────────────────────────────────────────────────
# 규칙
#   - `"적용_시작일"` 의 **값**은 따옴표 없이 적는다 (2026-08-01). TOML 의 날짜 값이다.
#     ("2026-08-01" 처럼 감싸면 글자가 되어 에러가 난다. 칸 이름의 따옴표와 헷갈리지 말 것.)
#   - 단가가 바뀌면 줄을 고치지 말고 **새 구간을 하나 더 붙인다.** 그래야 지난 회차를
#     그때 단가로 되짚을 수 있다 (FR-006 · spec.md 320줄).
#   - 적용 시작일 **당일부터** 그 단가다. 그보다 이른 회차는 앞 구간을 쓰고,
#     맨 처음 구간보다도 이르면 「모름」이다.
#   - 같은 모델에 같은 시작일을 두 번 적으면 에러가 난다.
#   - 모델 이름은 **실제로 응답한 모델 ID** 를 그대로 적는다 (llm_calls.model_id).
#     .env.local 에 적은 「고른 모델」과 다를 수 있다 (T089).
#
# ⚠️ 2026-08-12 채움 — 공급자 공식 가격 페이지에서 그대로 옮겼다. 표준(비-배치·비-우선순위) API
#    가격이다. 지어낸 숫자가 아니다:
#    - Gemini: https://ai.google.dev/gemini-api/docs/pricing (2026-08-11 자 페이지, Flash-Lite 표준 티어)
#    - Claude: https://platform.claude.com/docs/en/about-claude/pricing
#      (Sonnet 5 는 출시 때 「2026-08-31 까지 도입가」라던 $2/$10 이 정가로 굳었다 — 예정됐던
#      $3/$15 인상은 취소됐다고 그 페이지에 적혀 있다.)
#    `적용_시작일` 을 2026-08-01 로 잡은 이유 — 이 프로젝트가 실제로 그 이전 단가를 기록해 둔
#    적이 없다(그 전 단가가 같았는지 달랐는지 확인할 길이 없다). 그래서 **내가 값을 확인한
#    시점 이전으로 소급하지 않았다.** 8월 이전 회차의 금액이 필요해지면 그때 가서 그 시점
#    단가를 따로 확인하고 구간을 앞에 덧붙여라 — 지금 이 값을 과거로 늘리지 마라.

[["모델"."gemini-3.5-flash-lite"]]
"적용_시작일" = 2026-08-01
"입력_단가" = 0.30
"출력_단가" = 2.50

[["모델"."claude-sonnet-5"]]
"적용_시작일" = 2026-08-01
"입력_단가" = 2
"출력_단가" = 10
